
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Crop Listing</title>

    <link rel="stylesheet" href="{% static 'css/edit_crop_listing.css' %}">

</head>

<body>

    <div class="page-container">

        <div class="form-card">

            <div class="form-header">
                <h2>Edit Crop Listing</h2>
                <p>Update the quantity and price of your crop.</p>
            </div>


            <form method="POST">

                {% csrf_token %}


                <!-- CROP NAME -->

                <div class="form-group">

                    <label for="crop_name">
                        Crop Name
                    </label>

                    <input
                        type="text"
                        id="crop_name"
                        value="{{ listing.crop_name }}"
                        readonly
                    >

                </div>


                <!-- QUANTITY -->

                <div class="form-group">

                    <label for="quantity">
                        Quantity
                    </label>

                    <input
                        type="number"
                        id="quantity"
                        step="0.01"
                        name="quantity"
                        value="{{ listing.quantity }}"
                        required
                    >

                </div>


                <!-- QUANTITY UNIT -->

                <div class="form-group">

                    <label for="quantity_unit">
                        Quantity Unit
                    </label>

                    <select
                        id="quantity_unit"
                        name="quantity_unit"
                        required
                    >

                        <option value="Kg"
                            {% if listing.quantity_unit == "Kg" %}
                                selected
                            {% endif %}>
                            Kg
                        </option>

                        <option value="Quintal"
                            {% if listing.quantity_unit == "Quintal" %}
                                selected
                            {% endif %}>
                            Quintal
                        </option>

                        <option value="Ton"
                            {% if listing.quantity_unit == "Ton" %}
                                selected
                            {% endif %}>
                            Ton
                        </option>

                    </select>

                </div>


                <!-- PRICE -->

                <div class="form-group">

                    <label for="price">
                        Price
                    </label>

                    <input
                        type="number"
                        id="price"
                        step="0.01"
                        name="price"
                        value="{{ listing.price }}"
                        required
                    >

                </div>


                <!-- PRICE UNIT -->

                <div class="form-group">

                    <label for="price_unit">
                        Price Unit
                    </label>

                    <select
                        id="price_unit"
                        name="price_unit"
                        required
                    >

                        <option value="Kg"
                            {% if listing.price_unit == "Kg" %}
                                selected
                            {% endif %}>
                            Per Kg
                        </option>

                        <option value="Quintal"
                            {% if listing.price_unit == "Quintal" %}
                                selected
                            {% endif %}>
                            Per Quintal
                        </option>

                        <option value="Ton"
                            {% if listing.price_unit == "Ton" %}
                                selected
                            {% endif %}>
                            Per Ton
                        </option>

                    </select>

                </div>


                <!-- SUBMIT -->

                <button type="submit" class="save-btn">
                    Save Changes
                </button>

            </form>

        </div>

    </div>

</body>

</html>
