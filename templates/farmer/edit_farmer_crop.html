{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Crop Listing</title>

    <link rel="stylesheet" href="{% static 'css/edit_crop_listing.css' %}">

</head>


<body>


    <main class="page-container">


        <div class="form-card">


            <!-- HEADER -->

            <div class="form-header">

                <span class="form-label">
                    CROP LISTING
                </span>

                <h2>
                    Edit Crop Listing
                </h2>

                <p>
                    Update the quantity and price details of your crop.
                </p>

            </div>



            <!-- FORM -->

            <form method="POST">

                {% csrf_token %}


                <!-- CROP NAME -->

                <div class="form-group">

                    <label>
                        Crop Name
                    </label>

                    <input
                        type="text"
                        value="{{ listing.crop_name }}"
                        readonly
                    >

                </div>



                <!-- QUANTITY -->

                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        value="{{ listing.quantity }}"
                        step="1"
                        required
                    >

                </div>



                <!-- QUANTITY UNIT -->

                <div class="form-group">

                    <label>
                        Quantity Unit
                    </label>

                    <select name="quantity_unit" required>

                        <option value="Kg"
                            {% if listing.quantity_unit == "Kg" %}selected{% endif %}>
                            Kg
                        </option>

                        <option value="Quintal"
                            {% if listing.quantity_unit == "Quintal" %}selected{% endif %}>
                            Quintal
                        </option>

                        <option value="Ton"
                            {% if listing.quantity_unit == "Ton" %}selected{% endif %}>
                            Ton
                        </option>

                    </select>

                </div>



                <!-- PRICE -->

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ listing.price }}"
                        step="0.01"
                        required
                    >

                </div>



                <!-- PRICE UNIT -->

                <div class="form-group">

                    <label>
                        Price Unit
                    </label>

                    <select name="price_unit" required>

                        <option value="Per Kg"
                            {% if listing.price_unit == "Per Kg" %}selected{% endif %}>
                            Per Kg
                        </option>

                        <option value="Per Quintal"
                            {% if listing.price_unit == "Per Quintal" %}selected{% endif %}>
                            Per Quintal
                        </option>

                        <option value="Per Ton"
                            {% if listing.price_unit == "Per Ton" %}selected{% endif %}>
                            Per Ton
                        </option>

                    </select>

                </div>



                <!-- SUBMIT -->

                <button type="submit" class="save-btn">
                    Save Changes
                </button>


            </form>


        </div>


    </main>


</body>

</html>
