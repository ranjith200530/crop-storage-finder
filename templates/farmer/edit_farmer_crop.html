
{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Crop Listing</title>

    <link rel="stylesheet" href="{% static 'css/edit_crop_listing.css' %}">

</head>

<body>

    <main class="page-container">

        <div class="form-card">

            <!-- Header -->

            <div class="form-header">

                <span class="form-label">
                    CROP LISTING
                </span>

                <h1>
                    Edit Crop Listing
                </h1>

                <p>
                    Update the quantity and price details of your crop.
                </p>

            </div>


            <!-- Form -->

            <form method="POST">

                {% csrf_token %}


                <!-- Crop Name -->

                <div class="form-group">

                    <label>
                        Crop Name
                    </label>

                    <input
                        type="text"
                        value="{{ listing.crop_name }}"
                        readonly
                    >

                </div>


                <!-- Quantity -->

                <div class="form-group">

                    <label>
                        Quantity
                    </label>

                    <input
                        type="number"
                        name="quantity"
                        value="{{ listing.quantity }}"
                        required
                    >

                </div>


                <!-- Quantity Unit -->

                <div class="form-group">

                    <label>
                        Quantity Unit
                    </label>

                    <select name="quantity_unit" required>

                        <option value="Kg"
                            {% if listing.quantity_unit == "Kg" %}selected{% endif %}>
                            Kg
                        </option>

                        <option value="Quintal"
                            {% if listing.quantity_unit == "Quintal" %}selected{% endif %}>
                            Quintal
                        </option>

                        <option value="Ton"
                            {% if listing.quantity_unit == "Ton" %}selected{% endif %}>
                            Ton
                        </option>

                    </select>

                </div>


                <!-- Price -->

                <div class="form-group">

                    <label>
                        Price
                    </label>

                    <input
                        type="number"
                        name="price"
                        value="{{ listing.price }}"
                        required
                    >

                </div>


                <!-- Price Unit -->

                <div class="form-group">

                    <label>
                        Price Unit
                    </label>

                    <select name="price_unit" required>

                        <option value="kg"
                            {% if listing.price_unit == "kg" %}selected{% endif %}>
                            Per Kg
                        </option>

                        <option value="Quintal"
                            {% if listing.price_unit == "Quintal" %}selected{% endif %}>
                            Per Quintal
                        </option>

                        <option value="Ton"
                            {% if listing.price_unit == "Ton" %}selected{% endif %}>
                            Per Ton
                        </option>

                    </select>

                </div>


                <!-- Submit -->

                <button type="submit">
                    Save Changes
                </button>

            </form>

        </div>

    </main>

</body>

</html>
