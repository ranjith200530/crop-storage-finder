<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Crop Listing</title>
</head>

<body>

<h2>Edit Crop Listing</h2>

<form method="POST">

    {% csrf_token %}

    <label>Crop Name</label>
    <input
        type="text"
        value="{{ listing.crop_name }}"
        readonly
    >

    <br><br>

    <label>Quantity</label>
    <input
        type="number"
        step="0.01"
        name="quantity"
        value="{{ listing.quantity }}"
        required
    >

    <br><br>

    <label>Quantity Unit</label>

    <select name="quantity_unit" required>

        <option value="Kg"
            {% if listing.quantity_unit == "Kg" %}selected{% endif %}>
            Kg
        </option>

        <option value="Quintal"
            {% if listing.quantity_unit == "Quintal" %}selected{% endif %}>
            Quintal
        </option>

        <option value="Ton"
            {% if listing.quantity_unit == "Ton" %}selected{% endif %}>
            Ton
        </option>

    </select>

    <br><br>

    <label>Price</label>

    <input
        type="number"
        step="0.01"
        name="price"
        value="{{ listing.price }}"
        required
    >

    <br><br>

    <label>Price Unit</label>

    <select name="price_unit" required>

        <option value="kg"
            {% if listing.price_unit == "kg" %}selected{% endif %}>
            Per Kg
        </option>

        <option value="Quintal"
            {% if listing.price_unit == "Quintal" %}selected{% endif %}>
            Per Quintal
        </option>

        <option value="Ton"
            {% if listing.price_unit == "Ton" %}selected{% endif %}>
            Per Ton
        </option>

    </select>

    <br><br>

    <button type="submit">
        Save Changes
    </button>

</form>

</body>
</html>
