{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | Crop Storage Finder</title>

    <link rel="stylesheet" href="{% static 'css/register.css' %}">
</head>

<body>

    <main class="register-page">

        <section class="register-card">

            <!-- Project Name -->
            <div class="brand">

                <h1>Crop Storage Finder</h1>

                <p>Farmer–Buyer Marketplace</p>

            </div>


            <!-- Heading -->
            <div class="register-heading">

                <h2>Create Account</h2>

                <p>Register to access the platform</p>

            </div>


            <!-- Messages -->
            {% if messages %}

                <div class="messages-container">

                    {% for message in messages %}

                        <div class="message {{ message.tags }}">

                            <span class="message-icon">!</span>

                            <span class="message-text">
                                {{ message }}
                            </span>

                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- Registration Form -->
            <form method="POST" action="" class="register-form">

                {% csrf_token %}


<!-- First Name -->
<div class="form-group">

    <label for="first_name">
        First Name
    </label>

    <input
        type="text"
        id="first_name"
        name="first_name"
        placeholder="Enter your first name"
        autocomplete="given-name"
        required
    >

</div>


<!-- Last Name -->
<div class="form-group">

    <label for="last_name">
        Last Name
    </label>

    <input
        type="text"
        id="last_name"
        name="last_name"
        placeholder="Enter your last name"
        autocomplete="family-name"
        required
    >

</div>


<!-- Email -->
<div class="form-group">

    <label for="email">
        Email
    </label>

    <input
        type="email"
        id="email"
        name="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
    >

</div>



                <!-- Password -->
                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Confirm Password -->
                <div class="form-group">

                    <label for="confirm_password">
                        Re-enter Password
                    </label>

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- Role -->
                <div class="form-group">

                    <label for="role">
                        Select Role
                    </label>

                    <select
                        id="role"
                        name="role"
                        required
                    >

                        <option value="" selected disabled>
                            -- Select Role --
                        </option>

                        <option value="Farmer">
                            Farmer
                        </option>

                        <option value="Buyer">
                            Buyer
                        </option>

                    </select>

                </div>


                <!-- Register Button -->
                <button
                    type="submit"
                    class="register-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Login -->
            <div class="login-section">

                <p>Already have an account?</p>

                <a href="{% url 'login' %}">
                    Login
                </a>

            </div>

        </section>

    </main>

</body>

</html>
