{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Storage</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="{% static 'css/register_storage.css' %}">
</head>

<body>

    <div class="storage-page">

        <div class="storage-card">

            <div class="form-header">
                <h2>Register Storage</h2>
                <p>Add your storage facility details</p>
            </div>

            <form method="POST">

                {% csrf_token %}
             

                <div class="form-section">

                    <h3>Storage Information</h3>

                    <div class="form-group">
                        <label for="storage_name">Storage Name</label>

                        <input type="text" id="storage_name" name="storage_name" placeholder="Enter storage name"
                            required>
                    </div>


                    <div class="form-group">

                        <label for="storage_type">Storage Type</label>

                        <select id="storage_type" name="storage_type" required>
                            <option value="">Select Storage Type</option>

                            <option value="cold_storage">
                                Cold Storage
                            </option>

                            <option value="warehouse">
                                Warehouse
                            </option>
                        </select>

                    </div>

                </div>



                <div class="form-section">

                    <h3>Capacity</h3>

                    <div class="form-row">

                        <div class="form-group">

                            <label for="capacity">
                                Total Capacity
                            </label>

                            <input type="number" id="capacity" name="capacity" min="1" step="0.01"
                                placeholder="Enter total capacity" required>

                        </div>


                        <div class="form-group">

                            <label for="capacity_unit">
                                Capacity Unit
                            </label>

                            <select id="capacity_unit" name="capacity_unit" required>
                                <option value="">Select Unit</option>
                                <option value="Ton">Ton</option>
                                <option value="MT">MT</option>
                            </select>

                        </div>

                    </div>

                </div>


               
                <div class="form-section">

                    <h3>Storage Charges</h3>

                    <div class="form-group">

                        <label for="price_per_kg">
                            Storage Charge
                        </label>

                        <div class="input-with-unit">

                            <input type="number" id="price_per_kg" name="price_per_kg" min="0" step="1"
                                placeholder="Enter charge" required>

                            <span>₹ / kg / month</span>

                        </div>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Storage Location</h3>

                    <div class="location-wrapper">

                        {% include "locations/locations_dropdown.html" %}

                    </div>


                    <div class="form-group">

                        <label for="address">
                            Complete Local Address
                        </label>

                        <textarea id="address" name="address" rows="4" placeholder="Enter complete local address"
                            required></textarea>

                    </div>

                </div>


                <div class="form-section">

                    <h3>Contact Information</h3>

                    <div class="form-group">

                        <label for="main_contact_number">
                            Main Contact Number
                        </label>

                        <input type="tel" id="main_contact_number" name="main_contact_number"
                            placeholder="Enter main contact number" required>

                    </div>


                    <div class="form-group">

                        <label for="additional_contact_number">
                            Additional Contact Number
                        </label>

                        <input type="tel" id="additional_contact_number" name="additional_contact_number"
                            placeholder="Enter additional contact number">

                    </div>

                </div>



                <div class="submit-section">

                    <button type="submit">
                        Register Storage
                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="{% static 'js/locations.js' %}"></script>

</body>

</html>
